name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time values only. None of these are real credentials.
  DATABASE_URL: postgres://getwithus:getwithus@localhost:5432/getwithus
  AUTH_SECRET: ci-auth-secret-000000000000000000000000000000
  ADMIN_EMAILS: admin@example.com
  VERIFICATION_PEPPER: ci-verification-pepper-0000000000000000000000
  CRON_SECRET: ci-cron-secret-00000000
  EMAIL_TRANSPORT: console
  EMAIL_FROM: Getwithus <no-reply@example.com>
  TEAM_NOTIFY_EMAILS: team@example.com
  LEADS_API_KEY: ci-leads-api-key-0000000000000000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm build

  # Whether the browser tests need to run: not on a pull request that only changes docs
  # (Markdown anywhere, or anything under docs/). Pushes to main always run them: runs on
  # main cancel each other, so a docs-only merge can cancel the run for a code merge just
  # before it, and comparing against that one commit would then skip code nobody tested on
  # main. Plain git, no third-party action.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both paths of a moved file, so moving code into docs/ still
          # counts as a code change.
          changed=$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA")
          echo "$changed"
          if echo "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs only: the browser tests will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The browser tests, split across machines that run at the same time, alongside `check`
  # rather than after it. Each machine builds the app and has its own database, because the
  # specs share one database and must not run side by side on it. Playwright keeps each spec
  # file on one machine unless the file opts in to being split (a11y and visual, which only
  # load pages). The machine count is the matrix length below. With four, the split measured
  # 12 / 11 / 17 / 5 tests (2.7, 2.3, 2.4 and 0.7 minutes of tests), about 4 minutes in all.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getwithus
          POSTGRES_PASSWORD: getwithus
          POSTGRES_DB: getwithus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getwithus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite migrates and empties this database; see tests/e2e/support/env.ts.
      E2E_DATABASE_URL: postgres://getwithus:getwithus@localhost:5432/getwithus_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Visual baselines are per platform. Until Linux baselines are committed, CI
      # writes them on the first run (uploaded below) instead of failing.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --update-snapshots=missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/**/*-linux.png
          retention-days: 14

  # The single "e2e" check that main requires (see the repository ruleset): it passes when
  # every shard passed, or when the changes job said exactly "false" (docs only) and the
  # shards were skipped. Anything else, including a missing answer, fails.
  e2e:
    if: always()
    needs: [changes, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Could not tell what changed ($CHANGES)."
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "Docs only: browser tests skipped."
            exit 0
          fi
          if [ "$CODE" != "true" ]; then
            echo "Could not tell whether the browser tests were needed ('$CODE')."
            exit 1
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "Browser tests did not pass ($SHARDS)."
            exit 1
          fi
          echo "All browser test shards passed."
